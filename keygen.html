<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shotcalc Keygen</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:16px;max-width:420px;margin:0 auto}
  h1{font-size:20px;color:#38bdf8;margin:8px 0 4px}
  p{color:#94a3b8;font-size:13px;margin:0 0 16px}
  label{display:block;font-size:12px;color:#94a3b8;margin:14px 0 4px}
  input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:15px}
  input:focus,select:focus{outline:2px solid #38bdf8}
  #go{background:#0ea5e9;border:none;font-weight:700;margin-top:20px;cursor:pointer}
  #go:disabled{opacity:.5;cursor:wait}
  #out{margin-top:18px;display:none}
  #out.ok{display:block}
  #out.err{display:block;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,monospace;background:#0b1220;border:1px solid #ef4444;border-radius:8px;padding:14px;font-size:14px;color:#fecaca}
  .card{background:#0b1220;border:1px solid #22c55e;border-radius:12px;padding:16px}
  .card .lbl{font-size:12px;color:#94a3b8;margin-bottom:6px}
  .card .big{font-size:24px;letter-spacing:1.5px;color:#4ade80;font-weight:700;word-break:break-all;margin-bottom:12px;user-select:all}
  .card .meta{font-size:12px;color:#94a3b8;margin-bottom:12px}
  .card .row{display:flex;gap:8px}
  .card .row button{flex:1;margin-top:0}
  #copy{background:#22c55e;border:none;font-weight:700;cursor:pointer}
  #copy.copied{background:#16a34a}
  #genAgain{background:#334155;border:1px solid #475569;cursor:pointer}
  small{color:#64748b;font-size:11px;display:block;margin-top:16px}
</style>
</head>
<body>
<h1>Shotcalc License Keygen</h1>
<p>Generate a license key for a buyer.</p>

<label>Admin secret</label>
<input type="password" id="secret" placeholder="your ADMIN_SECRET" autocomplete="off">

<label>Buyer name (note)</label>
<input type="text" id="note" placeholder="e.g. Discord#1234">

<label>Duration</label>
<select id="days">
  <option value="0">Lifetime</option>
  <option value="7">7 days</option>
  <option value="30" selected>30 days</option>
  <option value="90">90 days</option>
  <option value="365">1 year</option>
</select>

<button id="go">Generate Key</button>

<!-- Copy button is always visible; enabled only after a key is generated. -->
<button id="copyBtn" disabled style="margin-top:10px;background:#22c55e;opacity:.4">Copy Key</button>

<div id="out"></div>
<small>Keys are unbound - the first PC that enters them claims them permanently.</small>

<script>
const $ = (id) => document.getElementById(id);
let lastKey = '';

function showCard(html) {
  const out = $('out');
  out.className = 'ok';
  out.innerHTML = html;
}

function copyToClipboard(text, btn, label) {
  const done = () => {
    if (btn) {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = label; btn.classList.remove('copied'); }, 1500);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

$('copyBtn').addEventListener('click', () => {
  if (lastKey) copyToClipboard(lastKey, $('copyBtn'), 'Copy Key');
});

$('go').addEventListener('click', async () => {
  const secret = $('secret').value.trim();
  const note = $('note').value.trim();
  const days = parseInt($('days').value, 10) || 0;
  const out = $('out');
  if (!secret) { out.className = 'err'; out.textContent = 'Enter your admin secret.'; return; }
  $('go').disabled = true;
  out.className = '';
  out.innerHTML = '';
  try {
    const res = await fetch('https://echmjatjbykqisyywydg.supabase.co/functions/v1/admin-create-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
      body: JSON.stringify({ days, note })
    });
    const data = await res.json();
    if (!res.ok) {
      out.className = 'err';
      out.textContent = 'Error: ' + (data.error || res.status);
      return;
    }
    const durLabel = days > 0 ? days + ' day(s)' : 'Lifetime';
    lastKey = data.key;
    $('copyBtn').disabled = false;
    $('copyBtn').style.opacity = '1';
    showCard(
      '<div class="lbl">' + (note ? 'Key for ' + escapeHtml(note) : 'License key') + ' &mdash; ' + durLabel + '</div>' +
      '<div class="big" id="keyText">' + data.key + '</div>' +
      '<div class="meta">Expires: ' + (data.expires_at || 'lifetime') + '</div>' +
      '<div class="row">' +
        '<button id="copy">Copy Key</button>' +
        '<button id="genAgain">Generate Another</button>' +
      '</div>'
    );
    $('copy').addEventListener('click', () => copyToClipboard(data.key, $('copy'), 'Copy Key'));
    $('genAgain').addEventListener('click', () => { $('note').value = ''; $('out').className = ''; $('out').innerHTML = ''; });
  } catch (e) {
    out.className = 'err';
    out.textContent = 'Network error: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
